spring.application.name=ProductService
server.port=8082

# Optional local file (git-ignored) holding INTERNAL_SERVICE_API_KEY and DB_PASSWORD; see .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/charan
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema changes are versioned SQL files in src/main/resources/db/migration (Flyway); Hibernate only checks
# that the entities still match the schema. All services share one MySQL schema, so each keeps its own
# history table. Baseline-version 0 + an IF NOT EXISTS V1 lets an existing database (built earlier by
# ddl-auto=update) adopt Flyway without a manual step.
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_product
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Trusted callers (currently just OrderService) send this as X-Service-Key on every catalog-changing request.
# Must be the EXACT same value as INTERNAL_SERVICE_API_KEY on OrderService.
internal.service.api-key=${INTERNAL_SERVICE_API_KEY}

# Where POST /product/{id}/image writes an uploaded product photo - relative to the working directory the app
# was started from, not the classpath, so it survives a rebuild (unlike src/main/resources/static). Served back
# out at /uploads/** by WebConfig.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB